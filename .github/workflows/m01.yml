name: M01 Orchestrator CI

on:
  push:
    branches:
      - feature/M01-orchestrator
  pull_request:
    branches:
      - staging

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Syntax checks
        run: |
          php -l app/Services/Orchestration/AgentOrchestrator.php
          php -l tests/Unit/AgentOrchestratorTest.php
      - name: Orchestrator unit tests
        run: php artisan test --filter=AgentOrchestratorTest
