name: M01 Orchestrator CI

on:
  push:
    branches:
      - feature/M01-orchestrator
  pull_request:
    branches:
      - staging

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare test environment
        run: |
          echo "APP_ENV=testing" >> "$GITHUB_ENV"
          echo "APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" >> "$GITHUB_ENV"
          echo "DB_CONNECTION=sqlite" >> "$GITHUB_ENV"
          echo "DB_DATABASE=:memory:" >> "$GITHUB_ENV"
      - name: Syntax checks
        run: |
          php -l app/Services/Orchestration/AgentOrchestrator.php
          php -l tests/Unit/AgentOrchestratorTest.php
      - name: Orchestrator unit tests
        run: php artisan test --filter=AgentOrchestratorTest
