name: speakverse-staging
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: speakverse-app:m00
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [internal]
    volumes:
      - app_storage:/var/www/html/storage/app/public
      - app_logs:/var/www/html/storage/logs
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STAGING_HTTP_PORT:-8080}:80"
    depends_on: [app]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - app_storage:/var/www/html/public/storage:ro
    networks: [internal]
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${STAGING_DB_NAME:-speakverse_staging}
      MYSQL_USER: ${STAGING_DB_USER:-speakverse}
      MYSQL_PASSWORD: ${STAGING_DB_PASSWORD:?Set STAGING_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${STAGING_DB_ROOT_PASSWORD:?Set STAGING_DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]
networks:
  internal:
    driver: bridge
volumes:
  mysql_data:
  app_storage:
  app_logs:
